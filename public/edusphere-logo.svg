<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Emblem Cyan/Blue Gradient -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Subtle Diagonal Grid Pattern -->
    <pattern id="diagGrid" width="24" height="24" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#e2e8f0" stroke-width="1.2" stroke-opacity="0.6"/>
      <line x1="0" y1="0" x2="24" y2="0" stroke="#e2e8f0" stroke-width="1.2" stroke-opacity="0.6"/>
    </pattern>

    <!-- Soft Drop Shadow for Icon -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#diagGrid)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Official EduSphere Geometric Emblem (Rotated -45deg) -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Top-Left T-Bar -->
    <path d="M -90 -45 L 90 -45 M 0 -45 L 0 -115" stroke="url(#emblemGrad)" stroke-width="38" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- Bottom-Right T-Bar -->
    <path d="M -90 45 L 90 45 M 0 45 L 0 115" stroke="url(#emblemGrad)" stroke-width="38" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
</svg>
